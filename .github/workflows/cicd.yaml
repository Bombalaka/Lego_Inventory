# This workflow will build the lego inventory project

name: LegoInventoryCI/CD

on:
  push:
    branches:
    - "dev"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Check out this repo
      uses: actions/checkout@v4

    - name: Restore dependencies (install Nuget packages)
      run: dotnet restore

    - name: Build and publish the app
      run: |
        dotnet build --no-restore
        dotnet publish -c Release -o ./publish        

    - name: Upload app artifacts to Github
      uses: actions/upload-artifact@v4
      with:
        name: app-artifacts
        path: ./publish

  deploy:
    runs-on: self-hosted
    needs: build
    env:
      COSMOSDB_CONNECTIONSTRING: ${{ secrets.COSMOSDB_CONNECTIONSTRING }}
    steps:
    - name: Download the artifacts from Github (from the build job)
      uses: actions/download-artifact@v4
      with:
        name: app-artifacts

    - name: Stop the application service
      run: |
        sudo systemctl stop Lego_Inventory.service        

    - name: Deploy the the application
      run: |
        sudo rm -Rf /opt/Lego_Inventory || true
        sudo cp -r /home/azureuser/actions-runner/_work/Lego_Inventory/Lego_Inventory/ /opt/Lego_Inventory        
    
    - name: Update environment file with Cosmos DB connection string
      run: |
        sudo bash -c "cat > /etc/Lego_Inventory/.env << 'EOF'
        ASPNETCORE_ENVIRONMENT=Production
        ASPNETCORE_URLS=http://+:5000
        COSMOSDB_CONNECTIONSTRING=$COSMOSDB_CONNECTIONSTRING
        COSMOSDB_DATABASE=\"LegoInventory\"
        EOF"
        sudo chown www-data:www-data /etc/Lego_Inventory/.env
        sudo chmod 640 /etc/Lego_Inventory/.env
    - name: Start the application service
      run: |
        sudo systemctl start Lego_Inventory.service        